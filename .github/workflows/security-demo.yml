name: Record security challenges

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: securetask-aws
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run security scans
        run: python3 scripts/scan.py --tools semgrep checkov --demo

      - name: Upload security findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: demo-findings
          path: reports/
          retention-days: 7

  report:
    needs: scan
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: security-reporting

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: demo-findings
          path: reports

      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - run: python3 scripts/install-ssm-plugin.py

      - run: python3 scripts/report-via-ssm.py --tools semgrep checkov --scope demo
        env:
          DOJO_INSTANCE_ID: ${{ vars.DOJO_INSTANCE_ID }}
          DOJO_INTEGRATION_SECRET_ARN: ${{ vars.DOJO_INTEGRATION_SECRET_ARN }}

  review:
    needs: [scan, report]
    if: ${{ needs.scan.result == 'success' && needs.report.result == 'success' }}
    runs-on: ubuntu-latest
    environment: demo-review

    steps:
      - run: echo 'Demo approved. Fixtures were scanned only; no vulnerable image or infrastructure was deployed.'