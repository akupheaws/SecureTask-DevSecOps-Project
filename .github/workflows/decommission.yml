
name: Decommission all project infrastructure

on:
  workflow_dispatch:
    inputs:
      aws_account_id:
        description: "12-digit AWS account containing this project"
        required: true
        type: string

      confirmation:
        description: "Type DESTROY securetask to permanently delete data and state"
        required: false
        type: string

      diagnostic_only:
        description: "Test OIDC authentication only. Do not destroy infrastructure."
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: securetask-aws
  cancel-in-progress: false

jobs:
  plan:
    name: Review infrastructure decommission
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: infrastructure-plan

    steps:
      # --------------------------------------
      # 1. CHECKOUT REPOSITORY
      # --------------------------------------
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # --------------------------------------
      # 2. VALIDATE ACCOUNT INPUT
      # --------------------------------------
      - name: Validate requested AWS account
        env:
          ACCOUNT: ${{ inputs.aws_account_id }}
        run: |
          set -euo pipefail

          if [[ "$ACCOUNT" != "430986758702" ]]; then
            echo "::error::Unexpected AWS account ID."
            exit 1
          fi

          echo "Requested AWS account validated."

      # --------------------------------------
      # 3. DIAGNOSE GITHUB OIDC IDENTITY
      # --------------------------------------
      - name: Inspect GitHub OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = token.split('.')[1];

            const claims = JSON.parse(
              Buffer.from(payload, 'base64url').toString('utf8')
            );

            core.info('========== OIDC DIAGNOSTICS ==========');

            core.info(`Issuer: ${claims.iss}`);
            core.info(`Audience: ${claims.aud}`);
            core.info(`Subject: ${claims.sub}`);
            core.info(`Repository: ${claims.repository}`);
            core.info(`Repository ID: ${claims.repository_id}`);
            core.info(`Owner ID: ${claims.repository_owner_id}`);
            core.info(`Git Ref: ${claims.ref}`);

            core.info('======================================');

      # --------------------------------------
      # 4. AUTHENTICATE TO AWS USING OIDC
      # --------------------------------------
      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::430986758702:role/OIDC
          aws-region: us-east-1
          role-session-name: GitHubActionsDecommissionPlan
          audience: sts.amazonaws.com
          allowed-account-ids: "430986758702"
          retry-max-attempts: 1

      # --------------------------------------
      # 5. VERIFY AWS AUTHENTICATION
      # --------------------------------------
      - name: Verify AWS authentication
        env:
          ACCOUNT: ${{ inputs.aws_account_id }}
        run: |
          set -euo pipefail

          echo "Checking AWS identity..."

          aws sts get-caller-identity

          ACTUAL_ACCOUNT=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          if [[ "$ACTUAL_ACCOUNT" != "$ACCOUNT" ]]; then
            echo "::error::AWS account mismatch."
            exit 1
          fi

          echo "AWS OIDC authentication successful."

      # --------------------------------------
      # 6. SETUP TERRAFORM
      # --------------------------------------
      - name: Setup Terraform
        if: ${{ !inputs.diagnostic_only }}
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # --------------------------------------
      # 7. VALIDATE DECOMMISSION CONFIRMATION
      # --------------------------------------
      - name: Validate decommission confirmation
        if: ${{ !inputs.diagnostic_only }}
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [[ "$CONFIRMATION" != "DESTROY securetask" ]]; then
            echo "::error::Invalid decommission confirmation."
            exit 1
          fi

          echo "Decommission confirmation validated."

      # --------------------------------------
      # 8. REVIEW TERRAFORM RESOURCES
      # --------------------------------------
      - name: Review all four Terraform roots
        if: ${{ !inputs.diagnostic_only }}
        run: |
          python3 scripts/decommission.py plan \
            --account "$ACCOUNT" \
            --bucket "${BUCKET:-securetask-state-$ACCOUNT}" \
            --repository "$REPOSITORY" \
            --confirmation "$CONFIRMATION"
        env:
          ACCOUNT: ${{ inputs.aws_account_id }}
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REPOSITORY: ${{ github.repository }}
          CONFIRMATION: ${{ inputs.confirmation }}

      # --------------------------------------
      # 9. UPLOAD REVIEW ARTIFACT
      # --------------------------------------
      - name: Upload decommission review
        if: ${{ !inputs.diagnostic_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: decommission-review
          path: reports/decommission/
          if-no-files-found: error
          retention-days: 1

  # ========================================
  # DESTROY JOB
  # ========================================

  destroy:
    name: Destroy project infrastructure
    needs: plan
    if: ${{ github.ref == 'refs/heads/main' && !inputs.diagnostic_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: decommission

    steps:
      # --------------------------------------
      # 1. CHECKOUT REPOSITORY
      # --------------------------------------
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # --------------------------------------
      # 2. DOWNLOAD REVIEW ARTIFACT
      # --------------------------------------
      - name: Download decommission review
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: decommission-review
          path: reports/decommission

      # --------------------------------------
      # 3. SETUP TERRAFORM
      # --------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # --------------------------------------
      # 4. AUTHENTICATE USING AWS OIDC
      # --------------------------------------
      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::430986758702:role/OIDC
          aws-region: us-east-1
          role-session-name: GitHubActionsDecommissionDestroy
          audience: sts.amazonaws.com
          allowed-account-ids: "430986758702"
          retry-max-attempts: 1

      # --------------------------------------
      # 5. VERIFY AWS ACCOUNT
      # --------------------------------------
      - name: Verify AWS authentication
        env:
          ACCOUNT: ${{ inputs.aws_account_id }}
        run: |
          set -euo pipefail

          aws sts get-caller-identity

          ACTUAL_ACCOUNT=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          if [[ "$ACTUAL_ACCOUNT" != "430986758702" ]] || \
             [[ "$ACTUAL_ACCOUNT" != "$ACCOUNT" ]]; then
            echo "::error::AWS account mismatch."
            exit 1
          fi

          echo "AWS authentication successful."

      # --------------------------------------
      # 6. VALIDATE CONFIRMATION
      # --------------------------------------
      - name: Validate decommission confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [[ "$CONFIRMATION" != "DESTROY securetask" ]]; then
            echo "::error::Invalid confirmation."
            exit 1
          fi

      # --------------------------------------
      # 7. DESTROY INFRASTRUCTURE
      # --------------------------------------
      - name: Destroy reviewed resources and project data
        run: |
          python3 scripts/decommission.py destroy \
            --account "$ACCOUNT" \
            --bucket "${BUCKET:-securetask-state-$ACCOUNT}" \
            --repository "$REPOSITORY" \
            --confirmation "$CONFIRMATION"
        env:
          ACCOUNT: ${{ inputs.aws_account_id }}
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REPOSITORY: ${{ github.repository }}
          CONFIRMATION: ${{ inputs.confirmation }}

      # --------------------------------------
      # 8. UPLOAD DECOMMISSION RESULTS
      # --------------------------------------
      - name: Upload decommission result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: decommission-result
          path: reports/decommission/
          retention-days: 7
