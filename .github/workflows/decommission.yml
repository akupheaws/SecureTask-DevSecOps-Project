
name: Decommission all project infrastructure

on:
  workflow_dispatch:
    inputs:
      aws_account_id:
        description: "12-digit AWS account containing this project"
        required: true
        type: string

      confirmation:
        description: "Type DESTROY securetask to permanently delete data and state"
        required: false
        type: string

      diagnostic_only:
        description: "Test OIDC only. Do not destroy infrastructure."
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: securetask-aws
  cancel-in-progress: false

jobs:
  # ==========================================
  # JOB 1: PLAN AND OIDC DIAGNOSTICS
  # ==========================================
  plan:
    name: Review infrastructure decommission
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: infrastructure-plan

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # 2. Validate AWS account
      - name: Validate AWS account input
        env:
          ACCOUNT: ${{ inputs.aws_account_id }}
        run: |
          set -euo pipefail

          if [[ "$ACCOUNT" != "430986758702" ]]; then
            echo "::error::Invalid AWS account ID."
            exit 1
          fi

          echo "AWS account input validated."

      # 3. Inspect GitHub OIDC token claims
      - name: Inspect GitHub OIDC identity
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const claims = JSON.parse(
              Buffer.from(
                token.split('.')[1],
                'base64url'
              ).toString('utf8')
            );

            core.info('========== OIDC DIAGNOSTICS ==========');
            core.info(`Issuer: ${claims.iss}`);
            core.info(`Audience: ${claims.aud}`);
            core.info(`Subject: ${claims.sub}`);
            core.info(`Repository: ${claims.repository}`);
            core.info(`Repository ID: ${claims.repository_id}`);
            core.info(`Owner ID: ${claims.repository_owner_id}`);
            core.info(`Git Ref: ${claims.ref}`);
            core.info('======================================');

      # 4. Authenticate to AWS using OIDC
      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::430986758702:role/OIDC
          aws-region: us-east-1
          role-session-name: GitHubActionsDecommissionPlan
          audience: sts.amazonaws.com
          retry-max-attempts: 1

      # 5. Verify AWS identity
      - name: Verify AWS authentication
        env:
          ACCOUNT: ${{ inputs.aws_account_id }}
        run: |
          set -euo pipefail

          ACTUAL_ACCOUNT=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          if [[ "$ACTUAL_ACCOUNT" != "$ACCOUNT" ]]; then
            echo "::error::AWS account mismatch."
            exit 1
          fi

          aws sts get-caller-identity
          echo "AWS OIDC authentication successful."

      # 6. End safely if diagnostic mode enabled
      - name: OIDC diagnostic complete
        if: ${{ inputs.diagnostic_only }}
        run: |
          echo "OIDC authentication test completed."
          echo "Terraform operations are disabled."
          echo "No infrastructure will be destroyed."

      # 7. Setup Terraform
      - name: Setup Terraform
        if: ${{ !inputs.diagnostic_only }}
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # 8. Validate destroy confirmation
      - name: Validate decommission confirmation
        if: ${{ !inputs.diagnostic_only }}
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [[ "$CONFIRMATION" != "DESTROY securetask" ]]; then
            echo "::error::Invalid decommission confirmation."
            exit 1
          fi

          echo "Decommission confirmation validated."

      # 9. Review Terraform resources
      - name: Review all four Terraform roots
        if: ${{ !inputs.diagnostic_only }}
        run: |
          python3 scripts/decommission.py plan \
            --account "$ACCOUNT" \
            --bucket "${BUCKET:-securetask-state-$ACCOUNT}" \
            --repository "$REPOSITORY" \
            --confirmation "$CONFIRMATION"
        env:
          ACCOUNT: ${{ inputs.aws_account_id }}
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REPOSITORY: ${{ github.repository }}
          CONFIRMATION: ${{ inputs.confirmation }}

      # 10. Upload Terraform review artifact
      - name: Upload decommission review
        if: ${{ !inputs.diagnostic_only }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: decommission-review
          path: reports/decommission/
          if-no-files-found: error
          retention-days: 1

  # ==========================================
  # JOB 2: DESTROY INFRASTRUCTURE
  # ==========================================
  destroy:
    name: Destroy project infrastructure
    needs: plan
    if: ${{ github.ref == 'refs/heads/main' && !inputs.diagnostic_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: decommission

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # 2. Validate confirmation
      - name: Validate destruction confirmation
        env:
          ACCOUNT: ${{ inputs.aws_account_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [[ "$ACCOUNT" != "430986758702" ]]; then
            echo "::error::Unexpected AWS account."
            exit 1
          fi

          if [[ "$CONFIRMATION" != "DESTROY securetask" ]]; then
            echo "::error::Invalid destruction confirmation."
            exit 1
          fi

      # 3. Download review artifact
      - name: Download decommission review
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: decommission-review
          path: reports/decommission

      # 4. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # 5. Inspect destroy environment OIDC claims
      - name: Inspect GitHub OIDC identity
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const claims = JSON.parse(
              Buffer.from(
                token.split('.')[1],
                'base64url'
              ).toString('utf8')
            );

            core.info('========== DESTROY OIDC ==========');
            core.info(`Audience: ${claims.aud}`);
            core.info(`Subject: ${claims.sub}`);
            core.info(`Repository: ${claims.repository}`);
            core.info(`Git Ref: ${claims.ref}`);
            core.info('==================================');

      # 6. Authenticate to AWS using OIDC
      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::430986758702:role/OIDC
          aws-region: us-east-1
          role-session-name: GitHubActionsDecommissionDestroy
          audience: sts.amazonaws.com
          retry-max-attempts: 1

      # 7. Verify AWS account
      - name: Verify AWS authentication
        env:
          ACCOUNT: ${{ inputs.aws_account_id }}
        run: |
          set -euo pipefail

          ACTUAL_ACCOUNT=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          if [[ "$ACTUAL_ACCOUNT" != "$ACCOUNT" ]]; then
            echo "::error::AWS account mismatch."
            exit 1
          fi

          aws sts get-caller-identity
          echo "AWS authentication successful."

      # 8. Destroy resources
      - name: Destroy reviewed resources and project data
        run: |
          python3 scripts/decommission.py destroy \
            --account "$ACCOUNT" \
            --bucket "${BUCKET:-securetask-state-$ACCOUNT}" \
            --repository "$REPOSITORY" \
            --confirmation "$CONFIRMATION"
        env:
          ACCOUNT: ${{ inputs.aws_account_id }}
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
          REPOSITORY: ${{ github.repository }}
          CONFIRMATION: ${{ inputs.confirmation }}

      # 9. Upload results
      - name: Upload decommission result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: decommission-result
          path: reports/decommission/
          retention-days: 7
